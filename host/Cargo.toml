[package]
name = "cyd-deck"
version = "0.3.0"
edition = "2024"
description = "Desktop app for CYD Deck: turns a Freenove ESP32-S3 2.8\" touch display into a macropad"
license = "MIT"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1"
eframe = "0.37"
getrandom = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["std"] }
rustybuzz = "0.20"
secret-service = { version = "5", features = ["rt-async-io-crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.10"
sha2 = "0.10"
toml = "1.1"
ureq = { version = "3", features = ["json"] }

[profile.release]
lto = true
strip = true

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "eframe"] }
