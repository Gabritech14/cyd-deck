# Compila l'AppImage del programma per il PC e la allega alla release.
# Builds the desktop app AppImage and attaches it to the release.
name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release to attach the AppImage to (empty = build only)"
        required: false

permissions:
  contents: write

jobs:
  appimage:
    # Ubuntu 22.04: la glibc più vecchia rende l'AppImage compatibile con più distro.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config mesa-vulkan-drivers  # Mesa: GPU software per i test dell editor
      - uses: dtolnay/rust-toolchain@stable
      # Un tag con "beta" (es. v0.4.0-beta) compila la beta, con l'indicatore della batteria.
      - name: Stable or beta
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in
            *beta*) echo "FEATURES=--features battery" >> "$GITHUB_ENV"; echo "APPIMAGE_SUFFIX=-beta" >> "$GITHUB_ENV" ;;
            *) echo "FEATURES=" >> "$GITHUB_ENV"; echo "APPIMAGE_SUFFIX=" >> "$GITHUB_ENV" ;;
          esac
      - name: Build
        working-directory: host
        run: cargo build --release --locked $FEATURES
      - name: Test
        working-directory: host
        run: cargo test --release --locked $FEATURES
      - name: AppImage
        run: |
          mkdir -p dist
          host/packaging/build-appimage.sh host/target/release/cyd-deck dist
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage
      - name: Attach to the release
        if: github.ref_type == 'tag' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" dist/*.AppImage --clobber
